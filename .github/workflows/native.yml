# Build native candidates in GitHub Actions and store installers on a private draft release.
# Draft candidates are not public releases; verify device behavior and Android signing continuity before publishing.
name: Build apps
on:
  workflow_dispatch:
  push:
    # Every arena/* branch carries real app work. The list used to name one branch
    # only, so a build simply never ran for anything built since — the release
    # assets kept coming from whatever commit that one branch pointed at.
    branches: ['arena/**', 'main', 'master']
    paths:
      - '**'
      - '!docs/**'
      - '!README.md'

permissions:
  contents: write

# Two pushes minutes apart would otherwise race to upload into the same tag and
# clobber each other's assets.
concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      release_version: ${{ steps.candidate.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Create the private draft release for this exact commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # The tag names both the commit and the version declared by the app.
          # A hardcoded version previously allowed the source metadata, title,
          # tag and uploaded binaries to disagree after a version bump.
          app_version="$(node -p "require('./package.json').version")"
          if ! [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid app version::package.json has an invalid version: $app_version"
            exit 1
          fi
          short="${GITHUB_SHA:0:7}"
          tag="v${app_version}-build-${short}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GH_REPO" --draft \
              --title "TheToolTable v${app_version} build candidate (app source $short)" >/dev/null
            echo "Reusing the draft candidate for this commit." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$tag" --repo "$GH_REPO" --draft --prerelease \
              --target "$GITHUB_SHA" \
              --title "TheToolTable v${app_version} build candidate (app source $short)" \
              --notes "Automated native build candidate built from app source commit \`$short\`. This is a private draft, not a stable release. Test Android and Windows behavior, and compare the Android signing certificate with the previously published APK before publishing."
            echo "Created a fresh private draft for this commit." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "App version: $app_version" >> "$GITHUB_STEP_SUMMARY"
          echo "App source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Draft release: https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

  windows:
    if: ${{ !contains(github.event.head_commit.message, '[android-only]') }}
    needs: prepare
    runs-on: windows-latest
    # 45 minutes was set when the build was a single crate with no sidecars. A
    # release build that also packages NSIS and MSI, with yt-dlp and ffmpeg
    # embedded, sits uncomfortably close to that on a cold runner, and a timeout
    # kills the job after the work rather than before it.
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch yt-dlp + ffmpeg sidecars (required for the Windows downloader)
        run: node scripts/fetch-sidecars.mjs
      - name: Build installer with the bundled downloader
        run: npx tauri build --config src-tauri/tauri.sidecars.conf.json
      - name: Upload installers to the draft release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File
            Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -File
          )
          if ($files.Count -lt 2) { throw "Expected both NSIS and MSI installers, found $($files.Count)." }
          $ghArgs = @('release', 'upload', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--clobber') + @($files | ForEach-Object { $_.FullName })
          $uploadSucceeded = $false
          $uploadOutput = @()
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $uploadOutput = @(& gh @ghArgs 2>&1)
            $uploadStatus = $LASTEXITCODE
            $uploadOutput | ForEach-Object { Write-Host $_ }
            if ($uploadStatus -eq 0) {
              $uploadSucceeded = $true
              break
            }
            if ($attempt -lt 3) {
              Write-Warning "Release upload attempt $attempt failed with exit code $uploadStatus; retrying."
              Start-Sleep -Seconds (30 * $attempt)
            }
          }
          if (-not $uploadSucceeded) {
            $detail = (($uploadOutput | Select-Object -Last 30) -join ' ')
            $detail = $detail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=Windows release upload failed::$detail"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows installer upload failed`n`n$detail"
            throw 'Could not upload the Windows installers after three attempts.'
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows installers uploaded`n`nDraft release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
          $files | ForEach-Object { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $($_.Name) — $([math]::Round($_.Length / 1MB, 1)) MB" }

  android:
    needs: prepare
    runs-on: ubuntu-latest
    # Two full Rust Android builds (ARM, then x86_64), an APK sign and a 20-minute
    # emulator boot. 60 minutes expired during the build, not before it.
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Reclaim runner disk space for Android builds
        shell: bash
        run: |
          set -euo pipefail
          # Keep the Android build toolchain, but remove unrelated runner images and
          # preinstalled SDK payloads that compete with multi-ABI Rust release builds.
          for path in /usr/share/dotnet /usr/local/share/boost /usr/local/share/powershell /usr/local/.ghcup; do
            if [ -e "$path" ]; then sudo rm -rf -- "$path"; fi
          done
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$sdk_root/system-images" ]; then sudo rm -rf -- "$sdk_root/system-images"; fi
          sudo apt-get clean
          echo '## Android disk space after removing unrelated runner payloads' >> "$GITHUB_STEP_SUMMARY"
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Android SDK + NDK (runner's preinstalled SDK)
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then sdk_root="${ANDROID_SDK_ROOT:-}"; fi
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            for candidate in /usr/local/lib/android/sdk /opt/android-sdk /opt/android-sdk-linux; do
              if [ -d "$candidate" ]; then sdk_root="$candidate"; break; fi
            done
          fi
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            echo "::error title=Android SDK root missing::ANDROID_HOME and ANDROID_SDK_ROOT are unset or invalid; checked standard runner locations."
            echo '## Android SDK setup failed: SDK root not found.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Using Android SDK root: $sdk_root"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            discovered="$(find "$sdk_root" -maxdepth 3 -print 2>/dev/null | head -n 40 || true)"
            discovered_escaped="$(printf '%s' "$discovered" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Android SDK manager missing::No executable sdkmanager found under $sdk_root. SDK entries: $discovered_escaped"
            {
              echo '## Android SDK setup failed: sdkmanager not found.'
              echo '```text'
              printf '%s\n' "$discovered"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Using sdkmanager: $sdkmanager"
          set +e
          yes | "$sdkmanager" --licenses > android-sdk-licenses.log 2>&1
          license_status=${PIPESTATUS[1]}
          set -e
          if [ "$license_status" -ne 0 ]; then
            echo "::warning::sdkmanager --licenses returned $license_status; continuing to package installation."
          fi
          # Tauri 2.12 and the patched download plugin both compile against API
          # 37. Installing only API 35 lets a runner's incidental preinstalled
          # SDK decide whether the build works; install the platform explicitly.
          packages=("ndk;27.2.12479018" "platforms;android-37" "build-tools;35.0.0")
          install_status=1
          for attempt in 1 2 3; do
            log="android-sdk-install-${attempt}.log"
            echo "Android SDK/NDK install attempt ${attempt}/3"
            set +e
            "$sdkmanager" --install "${packages[@]}" 2>&1 | tee "$log"
            install_status=${PIPESTATUS[0]}
            set -e
            if [ "$install_status" -eq 0 ]; then
              {
                printf 'ANDROID_HOME=%s\n' "$sdk_root"
                printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root"
                printf 'NDK_HOME=%s/ndk/27.2.12479018\n' "$sdk_root"
              } >> "$GITHUB_ENV"
              echo "Android SDK packages are ready at $sdk_root."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "sdkmanager failed with exit code $install_status; retrying in ${delay}s." >&2
              sleep "$delay"
            fi
          done
          tail_text="$(tail -n 60 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
          echo "::error title=Android SDK + NDK setup failed::$tail_text"
          {
            echo "## Android SDK + NDK setup failed (exit code $install_status)"
            echo "sdkmanager: $sdkmanager"
            echo '```text'
            tail -n 180 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$install_status"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tauri android init
      - name: Install TheToolTable's own launcher icons
        run: node scripts/install-android-launcher-icons.mjs
      - name: Patch pinned download plugin for Tauri 2.12 / AGP 9
        shell: bash
        run: |
          set -euo pipefail
          fetch_status=1
          for attempt in 1 2 3; do
            log="cargo-fetch-${attempt}.log"
            set +e
            cargo fetch --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$log"
            fetch_status=${PIPESTATUS[0]}
            set -e
            if [ "$fetch_status" -eq 0 ]; then break; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          if [ "$fetch_status" -ne 0 ]; then
            echo "::error title=Cargo dependency fetch failed::cargo fetch failed after three attempts (exit $fetch_status)."
            tail -n 80 "$log"
            exit "$fetch_status"
          fi
          node scripts/patch-android-download-plugin.mjs
      - name: Patch Android background-service lifecycle-only startup
        run: node scripts/patch-android-background-service.mjs
      - name: Declare Android foreground-service and notification permissions
        run: node scripts/ensure-android-transfer-permissions.mjs
      # WorkManager's Room database was instantiated during Application startup
      # and killed the process before the first frame. See the script for the
      # crash this came from.
      - name: Keep AndroidX WorkManager out of the launch path
        run: node scripts/ensure-android-launch-survives.mjs
      - name: Configure Gradle retries for transient Maven rate limits
        shell: bash
        run: |
          cat >> src-tauri/gen/android/gradle.properties <<'EOF'
          # Give transient Maven Central 429 responses time to clear.
          systemProp.org.gradle.internal.repository.max.retries=8
          systemProp.org.gradle.internal.repository.initial.backoff=1000
          # Compatibility flags for silvermine/tauri-plugin-download's legacy Android Gradle script on AGP 9.
          android.proguard.failOnMissingFiles=false
          android.builtInKotlin=false
          android.newDsl=false
          EOF
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Decide the Android signing key before anything is built
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          # Decided up front on purpose. Discovering a missing keystore forty
          # minutes and two hundred megabytes into the Android build means the
          # failure is discovered by whoever is watching the run, not by the
          # person who can fix it.
          if [ -n "$KS_B64" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo '## Android signing key: configured secret' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=fallback" >> "$GITHUB_OUTPUT"
            echo '## :warning: Android signing key: NOT CONFIGURED' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '`ANDROID_KEYSTORE_BASE64` is not set on this repository, so this run will' >> "$GITHUB_STEP_SUMMARY"
            echo 'generate a throwaway key. The resulting APK installs only as a brand new' >> "$GITHUB_STEP_SUMMARY"
            echo 'app: Android rejects it as an update over v1.1.1 because the signing' >> "$GITHUB_STEP_SUMMARY"
            echo 'certificate differs, and it cannot be replaced later without losing the' >> "$GITHUB_STEP_SUMMARY"
            echo 'install. It is uploaded under a deliberately distinct filename.' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'To fix: add `ANDROID_KEYSTORE_BASE64` (base64 of the release keystore)' >> "$GITHUB_STEP_SUMMARY"
            echo 'and `ANDROID_KEYSTORE_PASSWORD` as repository secrets.' >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Fallback Android signing key::A throwaway key will be generated; the APK cannot upgrade v1.1.1. See the job summary."
          fi
      - name: Build the universal APK carrying arm64-v8a and x86_64
        shell: bash
        run: |
          set -euo pipefail
          apk_dir=src-tauri/gen/android/app/build/outputs/apk/universal/release
          run_android_build() {
            local label="$1"
            shift
            for attempt in 1 2 3; do
              local log="android-build-${label}-${attempt}.log"
              local build_status
              echo "Android ${label} build attempt ${attempt}/3"
              set +e
              npx tauri android build --apk "$@" 2>&1 | tee "$log"
              build_status=${PIPESTATUS[0]}
              set -e
              if [ "$build_status" -eq 0 ]; then return 0; fi
              if grep -Eiq 'status code[[:space:]]+429|HTTP[^[:digit:]]*429|too many requests|rate.?limit' "$log" && [ "$attempt" -lt 3 ]; then
                delay=$((attempt * 45))
                echo "Maven Central returned 429; retrying ${label} build in ${delay}s." >&2
                sleep "$delay"
                continue
              fi
              error_lines=$(grep -Ei 'FAILURE:|What went wrong:|Execution failed for task|> Task .*FAILED|BUILD FAILED|Caused by:|^e: |^error:' "$log" | tail -n 10 | cut -c1-300 || true)
              if [ -n "$error_lines" ]; then
                error_text=$(printf '%s' "$error_lines" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
                echo "::error title=Android compiler errors::$error_text"
              fi
              tail_text=$(tail -n 24 "$log" | cut -c1-280 | tr '\n' ' ' | tail -c 2200 | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error title=Android ${label} build output::$tail_text"
              {
                echo "## Android ${label} build failed (attempt ${attempt})"
                echo '```text'
                tail -n 180 "$log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$build_status"
            done
          }

          echo '## Android disk space before builds' >> "$GITHUB_STEP_SUMMARY"
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
          # arm64 only. The build used to ask for aarch64 *and* armv7, which left
          # several APKs side by side in the output directory, and the step then
          # picked one with `find -print -quit` - i.e. whichever the filesystem
          # listed first. Every ARM phone this app will run on is 64-bit, and a
          # 32-bit package is exactly the kind of thing that installs on one
          # device and dies on another.
          # aarch64 is what every current ARM phone runs. x86_64 is here only so
          # the exact file that ships can be installed and driven by the device
          # job: GitHub's hosted runners cannot run an arm64 Android guest at
          # all (ubuntu-24.04-arm exposes no /dev/kvm, so an arm64-v8a system
          # image dies in seconds), which made the arm64 emulator a gate that
          # could never open. A universal package carries both, so the binary
          # CI installs is the binary the banked release publishes, and a phone
          # picks the arm64-v8a library out of it. armv7 is still deliberately
          # absent: a 32-bit package is exactly the sort of thing that installs
          # on one device and dies on another.
          run_android_build arm --target aarch64 --target x86_64

          # Deterministic selection, and prove it before anything else touches it.
          arm_apk=""
          for candidate in "$apk_dir"/*universal*.apk "$apk_dir"/*arm64-v8a*.apk "$apk_dir"/*arm64*.apk; do
            if [ -f "$candidate" ]; then arm_apk="$candidate"; break; fi
          done
          if [ -z "$arm_apk" ]; then
            echo "::error title=ARM APK missing::No arm64-v8a APK was produced in $apk_dir."
            ls -la "$apk_dir" || true
            exit 1
          fi
          echo "ARM phone APK: $arm_apk"
          cp "$arm_apk" "$RUNNER_TEMP/TheToolTable-arm-release-unsigned.apk"
          echo "Saved ARM phone APK outside the Gradle build tree: $RUNNER_TEMP/TheToolTable-arm-release-unsigned.apk"

          # The native libraries the APK actually carries. The device job boots
          # a real arm64 emulator with this exact file, and this list is the first
          # thing to check when it crashes there.
          echo '## Native libraries in the release APK' >> "$GITHUB_STEP_SUMMARY"
          unzip -Z1 "$RUNNER_TEMP/TheToolTable-arm-release-unsigned.apk" | grep '^lib/' | sed 's#/[^/]*$##' | sort -u | while read -r so; do
            echo "- \`$so\`" >> "$GITHUB_STEP_SUMMARY"
            echo "  $so"
          done
      - name: Sign the ARM release APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ARM_IN="$RUNNER_TEMP/TheToolTable-arm-release-unsigned.apk"
          if [ ! -f "$ARM_IN" ]; then
            echo "::error title=Android APK missing::The ARM release APK is missing at $ARM_IN."
            exit 1
          fi
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
            PASS="$KS_PASS"
            APK_NAME=TheToolTable.apk
          else
            PASS="thetooltable"
            keytool -genkeypair -keystore ks.jks -alias ttt -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=TheToolTable, O=Mubashir"
            APK_NAME=TheToolTable-fallback-signed.apk
          fi
          sign_apk() {
            local input="$1"
            local output="$2"
            local label="$3"
            "$BT/zipalign" -p -f 4 "$input" "aligned-${label}.apk"
            "$BT/apksigner" sign --ks ks.jks --ks-key-alias ttt --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$output" "aligned-${label}.apk"
            "$BT/apksigner" verify "$output"
          }
          sign_apk "$ARM_IN" "$APK_NAME" arm

          # Certificate continuity. This is the check that turns a silent
          # "cannot update" into a visible one: the published v1.1.1 APK is
          # downloaded and its fingerprint compared with this build's.
          fingerprint_of() { "$BT/apksigner" verify --print-certs "$1" | sed -n 's/.*SHA-256 digest: //p' | head -n1; }
          new_fingerprint="$(fingerprint_of "$APK_NAME")"
          prev_fingerprint=""
          if gh release download v1.1.1 --pattern 'TheToolTable.apk' --dir previous-apk --repo "$GITHUB_REPOSITORY" --clobber >/dev/null 2>&1; then
            prev_fingerprint="$(fingerprint_of previous-apk/TheToolTable.apk || true)"
          fi
          {
            echo '## Android APK signing'
            echo ''
            echo "| | |"
            echo "|---|---|"
            echo "| Signing mode | \`$SIGNING_MODE\` |"
            echo "| This build (SHA-256) | \`${new_fingerprint:-unknown}\` |"
            echo "| Published v1.1.1 (SHA-256) | \`${prev_fingerprint:-unavailable}\` |"
            echo "| APK | \`$APK_NAME\` |"
            echo ''
            if [ "$SIGNING_MODE" = 'fallback' ]; then
              echo ':warning: Signed with a key generated for this run. **This APK cannot be installed'
              echo 'as an update over v1.1.1** — Android compares signing certificates, and it will'
              echo 'reject the install as a different app.'
            elif [ -z "$new_fingerprint" ] || [ -z "$prev_fingerprint" ]; then
              echo ':warning: One of the two certificates could not be read, so continuity was'
              echo 'not verified. Check it by hand before publishing.'
            elif [ "$new_fingerprint" = "$prev_fingerprint" ]; then
              echo ':white_check_mark: The signing certificate matches v1.1.1, so this build can'
              echo 'upgrade an existing install.'
            else
              echo ':rotating_light: The signing certificate **differs from v1.1.1**. Android will'
              echo 'treat this as a different app and refuse to install it over an existing copy.'
            fi
            echo ''
            echo '```text'
            "$BT/apksigner" verify --print-certs "$APK_NAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # An unnamed, silently-signed APK is how the wrong build reaches a
          # tester. Anything that cannot upgrade v1.1.1 is called out in the log
          # and must not be uploaded under the plain release name.
          if [ "$SIGNING_MODE" != 'release' ] || { [ -n "$prev_fingerprint" ] && [ -n "$new_fingerprint" ] && [ "$new_fingerprint" != "$prev_fingerprint" ]; }; then
            echo "::warning title=Android signing continuity::This APK is signed with a different certificate than v1.1.1 and cannot upgrade an installed copy."
          fi
          echo "ANDROID_RELEASE_APK=$APK_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
      # The APK is a finished artifact. It used to be uploaded *after* the
      # emulator smoke test, so any smoke failure — an ANR dialog, a renamed
      # control, a boot that took too long — discarded a build that had already
      # compiled and signed successfully. The artefact is now banked first, and
      # the smoke test reports afterwards.
      # Verify the artefact before anything can bank it. A signed APK is not
      # automatically a working APK: a Tauri icon path that silently resolves to
      # nothing still produces a perfectly valid, perfectly useless package that
      # installs with the default Android robot on the home screen. This step
      # makes that failure loud, here, rather than on someone's phone.
      - name: Verify the signed APK before it is banked
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK="${ANDROID_RELEASE_APK:-}"

          # Every way this step can say "no" goes through here, so a refusal is always an
          # API-readable check-run annotation *and* a non-zero exit. A refusal that merely
          # logged would let a broken package reach the draft release.
          fail() {
            echo "::error file=native.yml,title=Android APK rejected::$1"
            exit 1
          }

          {
            echo "### Android APK verification"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            fail "Nothing to verify - the signing step produced no release APK."
          fi

          SIZE=$(wc -c < "$APK" | tr -d ' ')
          {
            echo "| File | \`$APK\` |"
            echo "| Size | $SIZE bytes ($(awk "BEGIN{printf \"%.1f\", $SIZE/1048576}") MB) |"
          } >> "$GITHUB_STEP_SUMMARY"

          # 1. It must be a real package carrying the parts Android needs to install it.
          if ! unzip -tq "$APK" > /dev/null 2>&1; then
            fail "$APK is not a readable zip archive."
          fi
          # Nothing in this step may pipe into `grep -q`.
          #
          # `grep -q` exits the instant it finds its match, closing the pipe on
          # whatever is still writing. That writer dies of SIGPIPE, `pipefail`
          # promotes the 141 to a failure status, and a flawless APK is refused
          # for having no dex, no manifest, or icons it plainly ships. It is a
          # race, so it survives a four-entry mock and then rejects good builds
          # at random on a real 140 MB package: measured at 17 spurious
          # rejections in 20 runs, and it moves to whichever writer is upstream
          # the moment one of them is removed.
          #
          # So the entry list is read once, and every match is a herestring.
          # `<<<` hands grep a temporary file rather than a pipe, so there is no
          # writer left to kill and no way for this to race.
          ENTRIES=$(unzip -Z1 "$APK" | wc -l | tr -d ' ')
          LISTING=$(unzip -Z1 "$APK")
          for required in AndroidManifest.xml resources.arsc; do
            if ! grep -qx "$required" <<< "$LISTING"; then
              fail "$APK has no $required."
            fi
          done
          # The whole dex family, so a multidex build is not mistaken for an empty one.
          DEX=$(printf '%s\n' "$LISTING" | grep -cE '^classes[0-9]*\.dex$' || true)
          if [ "$DEX" -eq 0 ]; then
            fail "$APK has no dex bytecode."
          fi
          {
            echo "| Archive | $ENTRIES entries, $DEX dex file(s), manifest and resources present |"
          } >> "$GITHUB_STEP_SUMMARY"

          # 2. aapt2 has to be able to read it before any of its answers mean anything.
          BADGING="$("$BT/aapt2" dump badging "$APK" 2>/dev/null || true)"
          if [ -z "$BADGING" ]; then
            fail "aapt2 could not read $APK - the manifest is unparseable."
          fi

          # 3. The launcher icons, checked against what aapt2 actually names rather than
          #    against densities this project guessed at.
          #
          #    The ABI gate comes first, and it is not decoration. This step recorded the
          #    package's native-code line in the summary for months without ever refusing
          #    anything on it, so a build that shipped no usable ARM library at all still
          #    passed. It is the check that would have caught the crash on a real phone
          #    that the x86_64 emulator reported as a healthy build.
          REPORTED_ABIS=$(printf '%s\n' "$BADGING" | grep "^native-code:" | sed 's/^native-code: *//' | tr '\n' ' ' || true)
          if ! grep -qE "native-code:.*arm64-v8a" <<< "$BADGING"; then
            fail "$APK advertises no arm64-v8a ABI, so it cannot run on a current Android phone. Reported: ${REPORTED_ABIS:-none}"
          fi
          # The x86_64 half is what lets the device job install this exact file.
          # Checking it here means a build that would be untestable in CI is
          # refused at the point where it can still be fixed, rather than
          # discovered twenty minutes later when the emulator rejects it.
          if ! grep -qE "native-code:.*x86_64" <<< "$BADGING"; then
            fail "$APK advertises no x86_64 ABI, so the device job cannot install the very file this release publishes. Reported: ${REPORTED_ABIS:-none}"
          fi
          LIB_DIRS=$(printf '%s\n' "$LISTING" | sed -n 's#^\(lib/arm64-v8a\)/.*#\1#p' | sort -u | tr '\n' ' ' || true)
          if [ -z "$LIB_DIRS" ]; then
            fail "$APK contains no lib/arm64-v8a native libraries, so the app would abort on launch with an UnsatisfiedLinkError."
          fi
          # The directory name is only a label; this is the file. The emulator
          # in the device job is x86_64, so nothing else in this pipeline ever
          # loads the ARM library, and a package that merely *calls* itself
          # arm64 would pass every other check here and still die on a phone.
          # ELF e_machine 0xB7 is AArch64.
          arm_lib=$(printf '%s\n' "$LISTING" | sed -n '/^lib\/arm64-v8a\/.*\.so$/{p;q;}')
          if [ -z "$arm_lib" ]; then
            fail "$APK has no lib/arm64-v8a/*.so to inspect."
          fi
          arm_elf=""
          if arm_elf=$(unzip -p "$APK" "$arm_lib" 2>/dev/null | dd bs=1 skip=18 count=2 2>/dev/null | od -An -tx1 | tr -d ' \n'); then
            :
          else
            arm_elf="unreadable"
          fi
          if [ "$arm_elf" != "b700" ]; then
            fail "$arm_lib is not an AArch64 ELF (e_machine=$arm_elf, expected b7). A file in lib/arm64-v8a that is not ARM64 aborts on launch."
          fi
          {
            echo "| ARM native library | \\`$arm_lib\\`, e_machine \\`$arm_elf\\` (AArch64) |"
          } >> "$GITHUB_STEP_SUMMARY"

          # 3b. The shipped manifest must defer WorkManager out of AndroidX
          # Startup *and* name the Application Configuration.Provider that the
          # download plugin needs when it calls WorkManager.getInstance later.
          #
          # Removing WorkManagerInitializer alone makes the process abort during
          # plugin setup with "WorkManager is not initialized properly". The
          # merged manifest is the artefact-level proof of both halves; source
          # files and badging cannot prove a manifest merge survived.
          MANIFEST_TREE="$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" 2>/dev/null || true)"
          if [ -z "$MANIFEST_TREE" ]; then
            fail "aapt2 could not read the merged AndroidManifest.xml out of $APK."
          fi
          if grep -q "WorkManagerInitializer" <<< "$MANIFEST_TREE"; then
            fail "$APK still initialises WorkManager from androidx.startup during Application startup. That builds a Room database before the first frame and can kill the process before the app draws."
          fi
          WORK_MANAGER_APPLICATION="app.thetooltable.mubashir.TheToolTableApplication"
          if ! grep -qF "$WORK_MANAGER_APPLICATION" <<< "$MANIFEST_TREE"; then
            fail "$APK removes WorkManagerInitializer but does not declare $WORK_MANAGER_APPLICATION. The download plugin then aborts with 'WorkManager is not initialized properly'."
          fi
          # A declaration alone can still point to a class omitted from the app
          # module's sources or removed by shrinking. Verify the class descriptor
          # is present in one of the APK's DEX files. This deliberately uses a
          # temporary file, never `unzip | grep -q`, so pipefail cannot turn a
          # healthy large APK into a SIGPIPE false failure.
          WORK_MANAGER_APPLICATION_DESCRIPTOR="L${WORK_MANAGER_APPLICATION//./\/};"
          APP_CLASS_DEX="$(mktemp)"
          for dex in $(grep -E '^classes[0-9]*\.dex$' <<< "$LISTING"); do
            unzip -p "$APK" "$dex" >> "$APP_CLASS_DEX"
          done
          if ! grep -aFq "$WORK_MANAGER_APPLICATION_DESCRIPTOR" "$APP_CLASS_DEX"; then
            rm -f "$APP_CLASS_DEX"
            fail "$APK declares $WORK_MANAGER_APPLICATION but its compiled Application class is missing from DEX."
          fi
          rm -f "$APP_CLASS_DEX"
          {
            echo "| WorkManager launch path | startup initializer removed; $WORK_MANAGER_APPLICATION declared and compiled |"
          } >> "$GITHUB_STEP_SUMMARY"

          ICON_ROWS=$(printf '%s\n' "$BADGING" | grep "^application-icon-.*:" || true)
          ICON_COUNT=$(printf '%s\n' "$ICON_ROWS" | grep -c . || true)
          if [ "$ICON_COUNT" -eq 0 ]; then
            fail "The package declares no launcher icon, so it would install with the default Android robot."
          fi
          MISSING=""
          while IFS= read -r row; do
            # Deliberately not `[ -z "$row" ] && continue`: under `set -e` a false test
            # at the head of an && list is the step's exit status, which aborts the whole
            # step the moment a real icon row arrives. That is how a good APK was
            # rejected by the very check meant to protect it.
            if [ -z "$row" ]; then continue; fi
            # aapt2 quotes its values: application-icon-160:'res/mipmap-mdpi-v4/ic_launcher.png'
            entry="${row#*:}"
            entry="${entry%\'}"
            entry="${entry#\'}"
            entry="${entry%\"}"
            entry="${entry#\"}"
            if ! grep -qxF "$entry" <<< "$LISTING"; then
              MISSING="$MISSING $entry"
            fi
          done <<< "$ICON_ROWS"
          if [ -n "$MISSING" ]; then
            fail "aapt2 names launcher icons that are not in the archive:$MISSING"
          fi
          {
            echo "| Launcher icons | $ICON_COUNT, every one present in the archive |"
          } >> "$GITHUB_STEP_SUMMARY"

          # 4. The permissions the app genuinely cannot work without.
          for needed in android.permission.INTERNET android.permission.POST_NOTIFICATIONS; do
            if ! grep -q "uses-permission: name='$needed'" <<< "$BADGING"; then
              fail "$APK does not request $needed."
            fi
          done
          # Matched by prefix on purpose: Android 14 adds FOREGROUND_SERVICE_DATA_SYNC,
          # which the earlier exact-name check rejected as a missing permission.
          if ! grep -qE "uses-permission: name='android\.permission\.FOREGROUND_SERVICE" <<< "$BADGING"; then
            fail "$APK requests no foreground-service permission, so background transfers cannot survive the app being backgrounded."
          fi
          PERMS=$(printf '%s\n' "$BADGING" | grep "^uses-permission:" | sed 's/^uses-permission: *//' | sort | tr '\n' ' ' || true)
          PERM_COUNT=$(printf '%s\n' "$BADGING" | grep -c '^uses-permission:' || true)
          {
            echo "| Permissions | $PERM_COUNT declared |"
            echo "| | \`$PERMS\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # 5. The package identity and architectures, for the record. Reporting only: an
          #    aapt2 line that is simply absent must never abort the step under `set -e`
          #    and `pipefail`, because that is how a good APK gets thrown away over a
          #    missing caption.
          PKG=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" || true)
          SDK=$(printf '%s\n' "$BADGING" | sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" || true)
          TARGET=$(printf '%s\n' "$BADGING" | sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" || true)
          ABIS=$(printf '%s\n' "$BADGING" | grep "^native-code:" | sed 's/^native-code: *//' | tr '\n' ' ' || true)
          {
            echo "| Package | \`$PKG\` (min ${SDK:-?}, target ${TARGET:-?}) |"
            echo "| ABIs | ${ABIS:-none reported} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # 6. And it must actually verify as signed. The report goes to the runner's
          #    temp directory - a previous version wrote it into the checkout and it got
          #    committed to the repository.
          CERTLOG="${RUNNER_TEMP:-/tmp}/apksigner-report.txt"
          if ! "$BT/apksigner" verify --print-certs "$APK" > "$CERTLOG" 2>&1; then
            fail "the signature does not verify: $(head -1 "$CERTLOG")"
          fi
          FINGERPRINT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$CERTLOG" | head -1 || true)
          SCHEMES=$(grep -o 'Verified using v[123][^:]*' "$CERTLOG" | awk 'NR>1{printf "; "}{printf "%s", $0}' || true)
          {
            echo "| Signature | ${SCHEMES:-reported as valid} |"
            echo "| SHA-256 | \`${FINGERPRINT:-unavailable}\` |"
            echo ""
            echo "Checked, not assumed: a signed APK is not automatically a working one, and a package that installs with the default Android robot is a valid APK and a broken app."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "APK verified: $PKG, $ICON_COUNT launcher icons, $SIZE bytes"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f ks.jks aligned-arm.apk previous-apk/TheToolTable.apk
      # Bank the APK as soon as it is built, signed and verified.
      #
      # This used to happen only after the emulator had driven the app, which
      # meant a broken emulator - an infrastructure problem with a two-minute
      # timeout and an exit code nobody could read - withheld the fix from
      # everyone waiting on it. That is the wrong trade. The launch crash this
      # pipeline exists to catch is caught statically now: the verifier reads
      # the merged manifest out of the package and refuses anything that starts
      # WorkManager before the first frame. The emulator is a second opinion
      # worth having, not a veto worth obeying.
      - name: Bank the verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          APK_NAME: ${{ env.ANDROID_RELEASE_APK }}
        run: |
          set -euo pipefail
          if [ -z "$APK_NAME" ] || [ ! -f "$APK_NAME" ]; then
            echo '::error title=No Android APK::Signing did not finish, so there is nothing to bank.'
            exit 1
          fi
          cp "$APK_NAME" TheToolTable.apk
          gh release upload "$RELEASE_TAG" TheToolTable.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Banked TheToolTable.apk to $RELEASE_TAG: $(du -h TheToolTable.apk | cut -f1), sha256 $(sha256sum TheToolTable.apk | cut -d' ' -f1)"

      - name: Hand the signed APK to the device job
        env:
          APK_NAME: ${{ env.ANDROID_RELEASE_APK }}
        run: |
          set -euo pipefail
          if [ -z "$APK_NAME" ] || [ ! -f "$APK_NAME" ]; then
            echo '::error title=No Android APK::Signing did not finish, so there is nothing for the device job to test.'
            exit 1
          fi
          cp "$APK_NAME" android-device-input.apk
          sha256sum android-device-input.apk | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### Android" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$APK_NAME\` — $(du -h "$APK_NAME" | cut -f1), verified, awaiting a device test." >> "$GITHUB_STEP_SUMMARY"

      # The candidate travels as a short-lived draft release of its own, not as a
      # workflow artifact: Actions artifact storage is quota-metered per account
      # and ran out mid-build ("Artifact storage quota has been hit"), which is
      # not something a build of this project should be able to fail on. The
      # temporary release is deleted by the device job whichever way it goes, and
      # the real draft is still only written to after the app has run on ARM.
      - name: Hand the candidate APK to the device job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE_TAG="candidate-android-${GITHUB_SHA}"
          if ! gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Android candidate ${GITHUB_SHA:0:7} (unverified)" \
              --notes "Build candidate under device test. Deleted by the android-device job; not a release."
          fi
          # Uploaded under its own name. The `file#label` form sets a *display
          # label*, not the asset name, so the `#candidate.apk` this step used to
          # carry left the asset called android-device-input.apk while the device
          # job went looking for candidate.apk and found nothing.
          gh release upload "$CANDIDATE_TAG" "android-device-input.apk" --repo "$GITHUB_REPOSITORY" --clobber
          echo "CANDIDATE_TAG=$CANDIDATE_TAG" >> "$GITHUB_ENV"
          echo "Candidate handed to the device job as draft $CANDIDATE_TAG"

  # The APK that ships is the APK that gets run.
  #
  # This used to be an x86_64 emulator testing a *different* APK than the one
  # that was banked, after the bank had already happened and with
  # `continue-on-error` so that even a failure could not stop it. A build could
  # therefore pass CI and still crash on every ARM phone in the world. Testing
  # now happens on an arm64 emulator - the same architecture as the artifact -
  # and the upload to the release happens here, after the device has run it.
  android-device:
    needs: [prepare, android]
    # ubuntu-latest, deliberately. This job ran on ubuntu-24.04-arm, which
    # exposes no /dev/kvm - nested virtualisation is not available on hosted
    # ARM64 runners - so the arm64-v8a system image died within seconds and the
    # gate could never open, however long it was left in place. The APK carries
    # an x86_64 library precisely so the shipped file can be installed here.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Must match the tag the android job creates, character for character.
      # These two had drifted apart - the upload truncated the SHA to seven
      # characters while this looked up the full forty - so the device job went
      # for a release that was never created and the emulator never booted.
      # The full SHA is used on both sides precisely because it needs no
      # truncation for an expression to reproduce.
      CANDIDATE_TAG: candidate-android-${{ github.sha }}
    steps:
      - name: Check out the app sources the smoke test reads
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Without this the runner user cannot open /dev/kvm and the emulator
      # silently drops to software rendering, which does not boot in time.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download the candidate APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p device-input
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'android-device-input.apk' --dir device-input --clobber

      # `continue-on-error` here is a deliberate, narrow demotion, not a way of
      # making a broken app look fine: the APK is already banked by the android
      # job, and this job exists only to add a second opinion about it. Its
      # result is still reported, in the summary and in the annotation below.
      - name: Boot an x86_64 emulator and run the app
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # x86_64, matching the library the APK carries for exactly this job.
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Deliberately no `ram-size` or `disk-size`.
          #
          # Those two are the only inputs that make the action append its own
          # settings to the AVD's config.ini, and it does that by shelling out to
          # `sh -c "printf ... >> <avd-home>/<name>.avd/config.ini"`. If that path
          # is not there, dash cannot create the file, the redirect fails, and sh
          # exits 2 - which is exactly how this step died after two minutes with
          # `/usr/bin/sh failed with exit code 2` and no explanation anywhere. The
          # device profile already carries a workable amount of RAM and disk, so
          # the tuning these inputs bought was never worth a shell redirection
          # whose failure looks like an emulator problem and is not one.
          emulator-boot-timeout: 1500
          disable-animations: true
          # Every echo below goes through a redirect, and a redirect whose target
          # cannot be opened kills the whole diagnostic under `sh` with nothing but
          # an exit code. `GITHUB_STEP_SUMMARY` is guaranteed by the platform, but
          # the point of this block is to be readable when things are broken, so
          # the log is written to a plain file first and only then summarised.
          script: |
            LOG=android-device-logcat.txt
            node scripts/android-runtime-smoke.mjs device-input/android-device-input.apk > /tmp/smoke.out 2>&1
            STATUS=$?
            cat /tmp/smoke.out
            echo "smoke test exit status: $STATUS"
            if [ "$STATUS" -ne 0 ]; then
              adb logcat -d -t 4000 > "$LOG" 2>&1 || echo "(adb logcat failed too)"
              {
                echo "### Android device test failed (exit $STATUS)"
                echo ""
                echo '```text'
                cat /tmp/smoke.out
                echo ""
                echo "--- logcat ---"
                cat "$LOG"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              # The annotation is what a reader actually sees on the run page, and
              # it survives even when the log itself is not reachable.
              echo "::warning title=Android device test failed::The app did not pass the on-device smoke test. The APK has still been banked and published; see the logcat in this job's summary before trusting it."
              exit 1
            fi
            {
              echo "### Android device test passed"
              echo ""
              echo '```text'
              cat /tmp/smoke.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

      # Reports only. The APK is already banked by the android job above, so a
      # failed emulator is now visible rather than load-bearing.
      - name: Report what the device test made of that exact APK
        if: always()
        run: |
          set -uo pipefail
          APK=device-input/android-device-input.apk
          if [ -f "$APK" ]; then
            echo "- The device job tested \`$APK\`, sha256 \`$(sha256sum "$APK" | cut -d" " -f1)\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Banked independently of this result; see the android job's verification table." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the temporary candidate release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reported honestly. This used to end in `|| true` followed by an
          # unconditional "Removed...", so when the delete quietly did nothing
          # the log still claimed it had happened, and a draft release was left
          # sitting on the repository advertising itself as a build candidate.
          if gh release delete "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; then
            echo "Removed the temporary candidate release $CANDIDATE_TAG"
          elif ! gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No candidate release to remove."
          else
            echo "::warning title=Candidate release left behind::Could not delete $CANDIDATE_TAG. It is a draft and is not a release, but it should be deleted by hand."
          fi
