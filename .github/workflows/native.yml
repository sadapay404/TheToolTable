# Builds the installable apps in the cloud (no local Rust / Android SDK needed):
#   • Windows installer  (.exe via NSIS + .msi)   — Tauri 2
#   • Android APK        (arm64 + armv7, signed)  — Tauri 2 mobile
# Run it from GitHub → Actions → "Build apps" → Run workflow, or push a tag like v1.0.0.
# Artifacts appear at the bottom of the run page (and as a Release when triggered by a tag).
name: Build apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch yt-dlp + ffmpeg sidecars (bundled so users install nothing)
        id: sidecars
        continue-on-error: true
        run: node scripts/fetch-sidecars.mjs
      - name: Build installer (with bundled downloader)
        if: steps.sidecars.outcome == 'success'
        run: npx tauri build --config src-tauri/tauri.sidecars.conf.json
      - name: Build installer (downloader sidecars unavailable)
        if: steps.sidecars.outcome != 'success'
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: TheToolTable-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tauri android init
      - name: Build APK (64-bit + 32-bit phones)
        run: npx tauri android build --apk --target aarch64 --target armv7
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          IN=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > ks.jks; PASS="$KS_PASS"
          else PASS="thetooltable"; keytool -genkeypair -keystore ks.jks -alias ttt -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=TheToolTable, O=Mubashir"; fi
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-key-alias ttt --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out TheToolTable.apk aligned.apk
          "$BT/apksigner" verify TheToolTable.apk
      - uses: actions/upload-artifact@v4
        with: { name: TheToolTable-Android, path: TheToolTable.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            TheToolTable-Windows/**
            TheToolTable-Android/*.apk
