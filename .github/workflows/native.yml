# Build native v1.2.0 candidates in GitHub Actions and store installers on a private draft release.
# Draft candidates are not public releases; verify device behavior and Android signing continuity before publishing.
name: Build apps
on:
  workflow_dispatch:
  push:
    branches: ['arena/01a10743-thetooltable']
    paths:
      - '**'
      - '!docs/**'
      - '!README.md'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.candidate.outputs.release_tag }}
    steps:
      - name: Create or reuse a private draft release
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="v1.2.0-build-${GITHUB_SHA:0:7}"
          if ! gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GH_REPO" --draft --prerelease \
              --target "$GITHUB_SHA" \
              --title "TheToolTable v1.2.0 build candidate (${GITHUB_SHA:0:7})" \
              --notes "Automated native build candidate for commit ${GITHUB_SHA}. This is a private draft, not a stable release. Test Android and Windows behavior and verify Android signing-certificate continuity with v1.1.1 before publishing."
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Draft release: https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch yt-dlp + ffmpeg sidecars (required for the Windows downloader)
        run: node scripts/fetch-sidecars.mjs
      - name: Build installer with the bundled downloader
        run: npx tauri build --config src-tauri/tauri.sidecars.conf.json
      - name: Upload installers to the draft release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File
            Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -File
          )
          if ($files.Count -lt 2) { throw "Expected both NSIS and MSI installers, found $($files.Count)." }
          $ghArgs = @('release', 'upload', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--clobber') + @($files | ForEach-Object { $_.FullName })
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows installers uploaded`n`nDraft release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
          $files | ForEach-Object { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $($_.Name) — $([math]::Round($_.Length / 1MB, 1)) MB" }

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Android SDK + NDK (runner's preinstalled SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tauri android init
      - name: Declare Android foreground-service and notification permissions
        run: node scripts/ensure-android-transfer-permissions.mjs
      - name: Configure Gradle retries for transient Maven rate limits
        shell: bash
        run: |
          cat >> src-tauri/gen/android/gradle.properties <<'EOF'
          # Give transient Maven Central 429 responses time to clear.
          systemProp.org.gradle.internal.repository.max.retries=8
          systemProp.org.gradle.internal.repository.initial.backoff=1000
          EOF
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK (64-bit + 32-bit phones)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            log="android-build-${attempt}.log"
            echo "Android build attempt ${attempt}/3"
            set +e
            npx tauri android build --apk --target aarch64 --target armv7 2>&1 | tee "$log"
            build_status=${PIPESTATUS[0]}
            set -e
            if [ "$build_status" -eq 0 ]; then exit 0; fi
            if grep -Eiq 'status code[[:space:]]+429|HTTP[^[:digit:]]*429|too many requests|rate.?limit' "$log" && [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 45))
              echo "Maven Central returned 429; retrying in ${delay}s." >&2
              sleep "$delay"
              continue
            fi
            {
              echo "## Android build failed (attempt ${attempt})"
              echo '```text'
              tail -n 180 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$build_status"
          done
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          IN=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > ks.jks; PASS="$KS_PASS"
          else PASS="thetooltable"; keytool -genkeypair -keystore ks.jks -alias ttt -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=TheToolTable, O=Mubashir"; fi
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-key-alias ttt --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out TheToolTable.apk aligned.apk
          "$BT/apksigner" verify TheToolTable.apk
          {
            echo '## Android APK signature fingerprint'
            echo '```text'
            "$BT/apksigner" verify --print-certs TheToolTable.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK to the draft release
        run: |
          gh release upload "$RELEASE_TAG" TheToolTable.apk --repo "$GITHUB_REPOSITORY" --clobber
          sha256sum TheToolTable.apk | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Draft release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
