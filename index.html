<!doctype html>
<html lang="en" data-theme="material">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FEF7FF" />
    <meta name="description" content="TheToolTable by Mubashir — a private, desktop-grade workbench of file tools that never leave your device." />
    <title>TheToolTable — By Mubashir</title>
    <script>
      /* Paint in the remembered theme on the very first frame: the colours live in
         html[data-theme="…"] blocks in styles.css, so setting the attribute here is enough and
         nothing flashes before React boots. Mirrors src/themes.js (favourite → last → default). */
      try {
        var ids = ['material', 'creamy', 'oled', 'cyberpunk', 'pastel', 'midnight']
        var t = localStorage.getItem('ttt-theme-fav') || localStorage.getItem('ttt-theme')
        if (t && ids.indexOf(t) !== -1) document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
