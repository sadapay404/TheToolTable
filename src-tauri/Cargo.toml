[package]
name = "thetooltable"
version = "1.3.0"
description = "TheToolTable — local-first tools by Mubashir"
authors = ["Mubashir"]
edition = "2021"

[lib]
name = "thetooltable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tauri-plugin-notification = "2.5"
tauri-plugin-upload = "2.5"
tauri-plugin-background-service = "1.0.1"
tauri-plugin-download = { git = "https://github.com/silvermine/tauri-plugin-download", rev = "13fd4e70226d121269f31a96ff2e3d79d81557f9" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
